<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Sentire Technologies — Migration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth_config.js"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<style>
:root{--bg:#0c0f14;--surface:#141820;--surface-2:#1a1f2b;--border:#262d3a;--text:#e8ecf4;--text-dim:#7a8599;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}.top h1{font-size:22px;}.sp{flex:1;}
.sub{color:var(--text-dim);font-size:13px;margin-bottom:14px;line-height:1.5;}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;}
.btn:hover{border-color:var(--accent);}.btn.ok{background:var(--green);border-color:var(--green);color:#04120a;}.btn:disabled{opacity:.45;cursor:default;}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500;}.btn.red{color:#fca5a5;border-color:rgba(239,68,68,.5);}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px;}
.fold{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:var(--text);}
.fold:hover{border-color:var(--accent);}.fold.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:rgba(59,130,246,.08);}
.fold .ic{font-size:26px;}.fold b{display:block;margin-top:6px;font-size:15px;}.fold span{color:var(--text-dim);font-size:12px;}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.drop{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--text-dim);cursor:pointer;margin:12px 0;}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--text);}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}.bar h2{font-size:17px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--border);vertical-align:middle;}
th{color:var(--text-dim);font-weight:600;font-size:12px;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.t-new{background:rgba(245,158,11,.14);color:var(--orange);}.t-sent{background:rgba(34,197,94,.14);color:var(--green);}.t-kept{background:rgba(148,163,184,.14);color:var(--text-dim);}
.msg{min-height:20px;margin:8px 0;font-size:13px;}.msg.bad{color:var(--red);}.msg.good{color:var(--green);}
.dim{color:var(--text-dim);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>📂 Migration</h1><span class="sp"></span><button class="btn" onclick="location.href='index.html'">← Main Page</button></div>
  <p class="sub">Save every document in its folder first. The files are kept safely online (private — Admin and Sub Admin only). Then press <b>🔄 Migrate</b> in a folder and the software posts them: Sales and Purchase bills into Accounts, bank statements into Smart Finance. A file is never posted twice.</p>
  <div class="folders" id="folders"></div>
  <div class="box" id="panel"></div>
</div>
<script>
/* 1.17.0: Admin → Migration — five folders (Sales, Purchases, L.R. copy, Banking, Other documents).
   Files are stored in the private Supabase bucket 'invoices' under migration/<folder>/…; the list (sfin_migration) is shared only
   between the Admin and Sub Admin. Migrate hands the files to the engines that already exist:
   Sales / Purchases → Accounts Data Migration (same hand-over as WhatsApp share, IndexedDB 'sentire-share'),
   Banking → Smart Finance bank statement reader (IndexedDB 'sentire-bank'). */
var A = window.SentireAuth, $ = function (id) { return document.getElementById(id); };
var FOLDERS = [
  { k: 'sales', ic: '🧾', name: 'Sales', hint: 'Sales bills — PDF or JPEG photo', accept: '.pdf,.jpg,.jpeg,.png,image/*', to: 'accounts' },
  { k: 'purchases', ic: '📥', name: 'Purchases', hint: 'Supplier / purchase bills — PDF or JPEG photo', accept: '.pdf,.jpg,.jpeg,.png,image/*', to: 'accounts' },
  { k: 'lr', ic: '🚚', name: 'L.R. copy', hint: 'Transporter L.R. copies — JPEG photo or PDF', accept: '.pdf,.jpg,.jpeg,.png,image/*', to: '' },
  { k: 'banking', ic: '🏦', name: 'Banking', hint: 'Bank statements (PDF, Excel, CSV) — JPEG photos are kept too', accept: '.pdf,.xls,.xlsx,.csv,.txt,.jpg,.jpeg,.png,image/*', to: 'bank' },
  { k: 'other', ic: '📁', name: 'Other documents', hint: 'Anything else to keep', accept: '', to: '' }
];
var KEY = 'sfin_migration', cur = 'sales';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function list() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function save(l) { localStorage.setItem(KEY, JSON.stringify(l)); }
function fold(k) { return FOLDERS.find(function (f) { return f.k === k; }); }
function me() { return (A && A.user && (A.user.name || A.user.login_id)) || ''; }
function client() { return A && A.client; }
function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function when(t) { return t ? new Date(t).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }
function say(t, cls) { var m = $('msg'); if (m) { m.textContent = t || ''; m.className = 'msg ' + (cls || ''); } }

function renderFolders() {
  var l = list();
  $('folders').innerHTML = FOLDERS.map(function (f) {
    var n = l.filter(function (x) { return x.folder === f.k; }), p = n.filter(function (x) { return !x.sentAt; }).length;
    return '<button class="fold' + (f.k === cur ? ' on' : '') + '" onclick="openFolder(\'' + f.k + '\')"><div class="ic">' + f.ic + '</div><b>' + esc(f.name) + '</b><span>' + n.length + ' file' + (n.length === 1 ? '' : 's') + (f.to && p ? ' · ' + p + ' to migrate' : '') + '</span></button>';
  }).join('');
}
function openFolder(k) { cur = k; renderFolders(); renderPanel(); }
function renderPanel() {
  var f = fold(cur), l = list().filter(function (x) { return x.folder === cur; }).sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
  var pend = l.filter(function (x) { return !x.sentAt; }).length;
  var canDel = !A.enabled || (A.user && (A.user.role === 'Admin' || A.canDelete()));
  var target = f.to === 'accounts' ? 'Accounts (Data Migration)' : f.to === 'bank' ? 'Smart Finance (bank entries)' : '';
  $('panel').innerHTML =
    '<div class="bar"><h2>' + f.ic + ' ' + esc(f.name) + '</h2><span class="sp"></span>' +
    (f.to ? '<button class="btn ok" id="migBtn" onclick="migrate()" ' + (pend ? '' : 'disabled') + '>🔄 Migrate ' + (pend ? pend + ' new file' + (pend > 1 ? 's' : '') : '') + '</button>' : '') + '</div>' +
    '<div class="dim">' + (f.to ? 'Migrate posts the new files into ' + target + '. Results (posted / not posted and why) are shown there.' : 'Files here are kept safely. Automatic posting for this folder is not set up yet.') + '</div>' +
    '<div class="drop" id="drop"><div style="font-size:26px">' + f.ic + '</div><b>Click or drop files here</b><div class="dim" style="margin-top:4px">' + esc(f.hint) + '</div></div>' +
    '<input type="file" id="file" multiple accept="' + esc(f.accept) + '" style="display:none">' +
    '<div class="msg" id="msg"></div>' +
    (l.length ? '<table><tr><th>File</th><th>Size</th><th>Saved</th><th>Status</th><th></th></tr>' + l.map(function (x) {
      var st = !f.to ? '<span class="tag t-kept">kept</span>' : x.sentAt ? '<span class="tag t-sent">✓ migrated</span><div class="dim">' + esc(when(x.sentAt)) + (x.sentBy ? ' · ' + esc(x.sentBy) : '') + '</div>' : '<span class="tag t-new">new — not migrated yet</span>';
      return '<tr><td>📄 ' + esc(x.name) + '</td><td>' + esc(size(x.size || 0)) + '</td><td>' + esc(when(x.at)) + (x.by ? '<div class="dim">' + esc(x.by) + '</div>' : '') + '</td><td>' + st + '</td><td style="white-space:nowrap">' +
        '<button class="btn sm" onclick="viewFile(\'' + x.id + '\')">👁 View</button> ' +
        (f.to && x.sentAt ? '<button class="btn sm" title="Send this file to migration again" onclick="migrate(\'' + x.id + '\')">🔄 Again</button> ' : '') +
        (canDel ? '<button class="btn sm red" onclick="delFile(\'' + x.id + '\')">🗑</button>' : '') + '</td></tr>';
    }).join('') + '</table>' : '<div class="dim" style="margin-top:8px">No files in this folder yet.</div>');
  var d = $('drop'), inp = $('file');
  d.onclick = function () { inp.click(); };
  inp.onchange = function () { addFiles(inp.files); inp.value = ''; };
  d.ondragover = d.ondragenter = function (e) { e.preventDefault(); d.classList.add('over'); };
  d.ondragleave = function () { d.classList.remove('over'); };
  d.ondrop = function (e) { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); };
}

async function addFiles(files) {
  files = [].slice.call(files || []); if (!files.length) return;
  var c = client(); if (!c) { say('Log in first — the files are saved online.', 'bad'); return; }
  var f = fold(cur), l = list(), ok = 0, same = 0, bad = [];
  if (f.k === 'sales' || f.k === 'purchases') { var n0 = files.length; files = files.filter(function (x) { return /\.(pdf|jpe?g|png|webp)$/i.test(x.name) || /^(application\/pdf|image\/)/.test(x.type || ''); }); if (files.length < n0) bad.push((n0 - files.length) + ' file(s) are not PDF or JPEG — bills must be a PDF or a photo'); }
  for (var i = 0; i < files.length; i++) {
    var x = files[i];
    if (l.some(function (y) { return y.folder === f.k && y.name === x.name && y.size === x.size; })) { same++; continue; }
    say('Saving ' + x.name + '… (' + (i + 1) + ' of ' + files.length + ')');
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var path = 'migration/' + f.k + '/' + id + '_' + x.name.replace(/[^A-Za-z0-9._-]+/g, '_');
    var r = await c.storage.from('invoices').upload(path, x, { upsert: false, contentType: x.type || 'application/octet-stream' });
    if (r.error) { bad.push(x.name + ': ' + r.error.message); continue; }
    l = list(); l.push({ id: id, folder: f.k, name: x.name, size: x.size, type: x.type || '', path: path, at: new Date().toISOString(), by: me() }); save(l); ok++;
  }
  renderFolders(); renderPanel();
  say((ok ? '✓ ' + ok + ' file(s) saved in ' + f.name + '. ' : '') + (same ? same + ' already in this folder (skipped). ' : '') + (bad.length ? 'Not saved: ' + bad.join('; ') : ''), bad.length ? 'bad' : 'good');
}
async function viewFile(id) {
  var x = list().find(function (y) { return y.id === id; }), c = client(); if (!x || !c) return;
  var w = window.open('', '_blank');
  var r = await c.storage.from('invoices').createSignedUrl(x.path, 3600);
  if (r.error) { if (w) w.close(); say('Could not open: ' + r.error.message, 'bad'); return; }
  if (w) w.location = r.data.signedUrl; else location.href = r.data.signedUrl;
}
async function delFile(id) {
  var x = list().find(function (y) { return y.id === id; }); if (!x) return;
  if (!confirm('Delete "' + x.name + '" from ' + fold(x.folder).name + '?\nIt is removed from this folder list (a safety copy stays online). Entries already posted from it stay.')) return;
  var c = client(); if (c) { var r = await c.storage.from('invoices').remove([x.path]); if (r.error) { say('Could not delete: ' + r.error.message, 'bad'); return; } }
  save(list().filter(function (y) { return y.id !== id; })); renderFolders(); renderPanel(); say('🗑 Deleted ' + x.name, 'good');
}
function idbPut(dbName, recs) {
  return new Promise(function (res, rej) {
    var r = indexedDB.open(dbName, 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('files', { keyPath: 'id' }); };
    r.onerror = function () { rej(r.error); };
    r.onsuccess = function () { var tx = r.result.transaction('files', 'readwrite'), st = tx.objectStore('files'); recs.forEach(function (x) { st.put(x); }); tx.oncomplete = res; tx.onerror = function () { rej(tx.error); }; };
  });
}
async function migrate(oneId) {
  var f = fold(cur), c = client(); if (!f.to) return; if (!c) { say('Log in first.', 'bad'); return; }
  var todo = list().filter(function (x) { return x.folder === f.k && (oneId ? x.id === oneId : !x.sentAt); }); if (!todo.length) return;
  var b = $('migBtn'); if (b) b.disabled = true;
  var recs = [], failed = [];
  for (var i = 0; i < todo.length; i++) {
    var x = todo[i]; say('Getting ' + x.name + '… (' + (i + 1) + ' of ' + todo.length + ')');
    var r = await c.storage.from('invoices').download(x.path);
    if (r.error || !r.data) { failed.push(x.name); continue; }
    recs.push({ id: Date.now() + '-' + i, name: x.name, type: x.type || r.data.type || 'application/pdf', blob: r.data, at: Date.now(), mig: x.id });
  }
  if (!recs.length) { say('Could not get the files: ' + failed.join(', '), 'bad'); if (b) b.disabled = false; return; }
  try { await idbPut(f.to === 'bank' ? 'sentire-bank' : 'sentire-share', recs); } catch (e) { say('Could not hand the files over: ' + e.message, 'bad'); if (b) b.disabled = false; return; }
  var now = new Date().toISOString(), ids = recs.map(function (x) { return x.mig; });
  save(list().map(function (y) { if (ids.indexOf(y.id) >= 0) { y.sentAt = now; y.sentBy = me(); } return y; }));
  say('Opening ' + (f.to === 'bank' ? 'Smart Finance' : 'Accounts') + ' — the files are being migrated…' + (failed.length ? ' (could not get: ' + failed.join(', ') + ')' : ''), 'good');
  setTimeout(function () { location.href = f.to === 'bank' ? 'smart_finance.html' : 'index.html#accounts'; }, 600);
}

function start() { renderFolders(); renderPanel(); }
if (!A || !A.enabled) start();
else A.ready.then(function (u) {
  if (!u) return;
  if (!A.isSecurityAdmin(u)) { document.querySelector('.wrap').innerHTML = '<div class="top"><h1>📂 Migration</h1></div><p class="sub">Only the Admin and Sub Admin can open this page.</p><button class="btn" onclick="location.href=\'index.html\'">← Main Page</button>'; return; }
  start();
});
document.addEventListener('st-sync', function (e) { if (!e.detail || !e.detail.keys || e.detail.keys.indexOf(KEY) >= 0) { renderFolders(); renderPanel(); } });
</script>
</body>
</html>
