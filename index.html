<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth_config.js"></script><script src="auth.js"></script><script src="sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="sentire.webmanifest">
<link rel="icon" href="sentire-32.png">
<link rel="apple-touch-icon" href="sentire-192.png">
<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sentire_sw.js").catch(function(){});});}</script>
<title>Sentire Technologies — Main Page</title>
<script src="sentire_common.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14;--surface:#141820;--surface-2:#1a1f2b;--border:#262d3a;
  --text:#e8ecf4;--text-dim:#7a8599;--text-muted:#4a5568;
  --accent:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--purple:#a855f7;--cyan:#06b6d4;
  --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;--side:236px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden;}
button{font-family:inherit;}

/* ── Layout ── */
.shell{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px;border-bottom:1px solid var(--border);}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;}
.brand b{display:block;font-size:14px;line-height:1.2;}
.brand span{font-size:11px;color:var(--text-dim);font-family:var(--mono);}

.nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-label{font-size:10px;font-family:var(--mono);color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;padding:14px 10px 6px;}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s;}
.nav-btn:hover{background:var(--surface-2);color:var(--text);}
.nav-btn.active{background:var(--surface-2);color:var(--text);box-shadow:inset 3px 0 0 var(--c,var(--accent));}
.nav-btn .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--accent));flex-shrink:0;font-family:var(--mono);}
.nav-btn .badge{margin-left:auto;font-size:10px;font-family:var(--mono);background:var(--red);color:#fff;border-radius:10px;padding:2px 7px;display:none;}
.nav-btn .badge.show{display:inline-block;}

.side-foot{border-top:1px solid var(--border);padding:14px;}
.mic{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);cursor:pointer;font-size:13px;}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--text-muted);}
.mic.on{border-color:var(--red);color:var(--text);}
.mic.on .dot{background:var(--red);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mic-status{font-size:11px;font-family:var(--mono);color:var(--text-muted);margin-top:8px;min-height:15px;word-break:break-word;}

/* ── Main area ── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);min-height:58px;}
.topbar h1{font-size:16px;font-weight:700;}
.topbar .crumb{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
.topbar .sp{flex:1;}
.tb-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;display:none;}
.tb-btn:hover{color:var(--text);border-color:var(--accent);}
.tb-btn.show{display:inline-block;}
.views{flex:1;position:relative;min-height:0;}
.view{position:absolute;inset:0;display:none;}
.view.active{display:block;}
.view iframe{width:100%;height:100%;border:0;background:var(--bg);}

/* ── Home ── */
#v-home{overflow-y:auto;}
.home{max-width:1100px;margin:0 auto;padding:28px 24px 100px;}
.hello h2{font-size:24px;font-weight:700;}
.hello p{color:var(--text-dim);font-size:13px;margin-top:4px;font-family:var(--mono);}
.sec-title{font-size:12px;font-family:var(--mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin:30px 0 12px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;color:var(--text);}
.kpi:hover{border-color:var(--c,var(--accent));transform:translateY(-1px);}
.kpi .k-label{font-size:12px;color:var(--text-dim);}
.kpi .k-val{font-size:28px;font-weight:700;margin-top:6px;font-family:var(--mono);}
.kpi .k-sub{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--mono);}
.kpi.alert .k-val{color:var(--red);}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.app{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;text-align:left;color:var(--text);transition:border-color .15s,transform .15s;}
.app:hover{border-color:var(--c);transform:translateY(-2px);}
.app .ic{width:42px;height:42px;border-radius:11px;background:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-family:var(--mono);margin-bottom:14px;}
.app h3{font-size:15px;margin-bottom:6px;}
.app p{font-size:12px;color:var(--text-dim);line-height:1.5;}
.quick{display:flex;flex-wrap:wrap;gap:10px;}
.q{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;}
.q:hover{border-color:var(--accent);}

/* ── Mobile: bottom tab bar ── */
.tabbar{display:none;}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;}
  .side{display:none;}
  .topbar{padding:10px 16px;min-height:52px;}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;}
  .tabbar button{flex:1;border:0;background:transparent;color:var(--text-dim);padding:8px 2px 10px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .tabbar button .ic{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono);}
  .tabbar button.active{color:var(--text);}
  .tabbar button.active .ic{background:var(--c);color:#fff;}
  .views{padding-bottom:62px;}
  .home{padding:20px 16px 40px;}
  .kpis{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">ST</div><div><b>Sentire Technologies</b><span>Main Page</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="mic" id="micBtn" onclick="toggleVoice()"><span class="dot"></span><span id="micLabel">Voice commands</span></button>
      <div class="mic-status" id="micStatus"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1 id="title">Home</h1><div class="crumb" id="crumb"></div></div>
      <div class="sp"></div>
      <button class="tb-btn" id="reloadBtn" onclick="reloadCurrent()">↻ Refresh</button>
      <button class="tb-btn" id="newTabBtn" onclick="openNewTab()">Open in new tab ↗</button>
    </div>
    <div class="views" id="views">
      <section class="view" id="v-home">
        <div class="home">
          <div class="hello"><h2 id="greet">Welcome</h2><p id="today"></p></div>

          <div class="sec-title">Today at a glance</div>
          <div class="kpis" id="kpis"></div>

          <div class="sec-title">Quick actions</div>
          <div class="quick">
            <button class="q" onclick="go('orders')">+ New order</button>
            <button class="q" onclick="go('crm')">+ Add lead</button>
            <button class="q" onclick="go('production')">+ New production job</button>
            <button class="q" onclick="go('jobwork')">+ Job work challan</button>
            <button class="q" onclick="go('calculator')">Loadcell calculator</button>
            <button class="q" onclick="go('inventory')">Check stock</button>
            <button class="q" onclick="go('accounts')">+ Income / expense</button>
            <button class="q" onclick="go('reminders')">+ Reminder</button>
            <button class="q" onclick="go('cohort')">Ask my data</button>
            <button class="q" onclick="go('masters')">Masters</button>
          </div>

          <div class="sec-title">All apps</div>
          <div class="apps" id="apps"></div>
        </div>
      </section>
    </div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>

<script>
// ═══ App list: add a new app here and it appears everywhere ═══
const APPS=[
  {key:'orders',     file:'orders.html',               name:'Order Sheet',         short:'Orders',     ic:'OS',c:'#3b82f6',desc:'Order entry, auto-fill, despatch, payment & credit tracking, PDF print'},
  {key:'crm',        file:'marketing_crm.html',        name:'Marketing CRM',       short:'CRM',        ic:'MC',c:'#a855f7',desc:'Leads, telecallers, sales pipeline, call logs and follow-ups'},
  {key:'production', file:'factory_production.html',   name:'Factory Production',  short:'Production', ic:'FP',c:'#22c55e',desc:'Kanban board from Received to Dispatched, jobs and workers'},
  {key:'jobwork',    file:'job_work.html',             name:'Job Work',            short:'Job Work',   ic:'JW',c:'#ec4899',desc:'Goods at outside job workers — sent, transferred, received back, days out'},
  {key:'calculator', file:'loadcell_calculator.html',  name:'Loadcell Calculator', short:'Calc',       ic:'LC',c:'#84cc16',desc:'Sensitivity trim: series resistor per leg, 750 Ω shunt, fitting sheet, matched sets'},
  {key:'inventory',  file:'inventory_management.html', name:'Inventory',           short:'Stock',      ic:'IM',c:'#f59e0b',desc:'Stock, BOM, reorder alerts and China import tracking'},
  {key:'accounts',   file:'accounts_reports.html',     name:'Accounts & Reports',  short:'Accounts',   ic:'AR',c:'#06b6d4',desc:'Income, expenses, P&L, receivables, bank statement import'},
  {key:'reminders',  file:'reminders.html',            name:'Reminders',           short:'Remind',     ic:'⏰',c:'#f43f5e',desc:'ODS (monthly), Annual and Business reminders — voice agent, Gmail & WhatsApp, phone alerts'},
  {key:'cohort',     file:'cohort.html',               name:'Cohort',              short:'Cohort',     ic:'CH',c:'#8b5cf6',desc:'Business dashboard: management, sales, customers, marketing, operations, ideas to grow income, and Ask your data'},
  {key:'masters',    file:'masters.html',              name:'Masters',             short:'Masters',    ic:'MS',c:'#64748b',desc:'Clients & payment days, transporters, approvers, company, holidays, reminder rules'}
];
if(window.SentireAuth&&SentireAuth.filterApps)SentireAuth.filterApps(APPS); // rights: hide apps this person may not open
const HOME={key:'home',name:'Main Page',short:'Main',ic:'⌂',c:'#3b82f6'};
const byKey=k=>k==='home'?HOME:APPS.find(a=>a.key===k);
const byFile=f=>f==='index.html'||f==='hub.html'?HOME:APPS.find(a=>a.file===f);
let current='home';

// ═══ Build menus ═══
function navButton(a){return `<button class="nav-btn" data-k="${a.key}" style="--c:${a.c}" onclick="go('${a.key}')"><span class="ic">${a.ic}</span>${a.name}<span class="badge" id="b-${a.key}"></span></button>`;}
document.getElementById('nav').innerHTML=navButton(HOME)+'<div class="nav-label">Apps</div>'+APPS.map(navButton).join('');
// Security button just under Masters — only for the Admin and Sub Admin (opens security.html)
if(window.SentireAuth&&SentireAuth.enabled)SentireAuth.ready.then(function(me){
  if(!me||!SentireAuth.isSecurityAdmin(me))return;
  var b=document.createElement('button');b.className='nav-btn';b.style.setProperty('--c','#ef4444');
  b.innerHTML='<span class="ic">🛡</span>Security';b.title='Who is logged in, from where — and log them out';
  b.onclick=function(){location.href='security.html';};
  var m=document.querySelector('#nav .nav-btn[data-k="masters"]');if(m)m.after(b);else document.getElementById('nav').appendChild(b);
});
document.getElementById('tabbar').innerHTML=[HOME,...APPS.filter(a=>a.key!=='masters'&&a.key!=='calculator')].map(a=>`<button data-k="${a.key}" style="--c:${a.c}" onclick="go('${a.key}')"><span class="ic">${a.ic}</span>${a.short}</button>`).join('');
document.getElementById('apps').innerHTML=APPS.map(a=>`<button class="app" style="--c:${a.c}" onclick="go('${a.key}')"><div class="ic">${a.ic}</div><h3>${a.name}</h3><p>${a.desc}</p></button>`).join('');

// ═══ Switch views (apps open inside this window and stay open) ═══
function go(key){if(!byKey(key))key='home';if(location.hash!=='#'+key)location.hash=key;else show(key);}
function show(key){
  const a=byKey(key)||HOME;current=a.key;
  if(a.key!=='home'&&!document.getElementById('v-'+a.key)){
    const v=document.createElement('section');v.className='view';v.id='v-'+a.key;
    v.innerHTML=`<iframe src="${a.file}" title="${a.name}"></iframe>`;
    document.getElementById('views').appendChild(v);
  }
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+a.key));
  document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('active',b.dataset.k===a.key));
  document.getElementById('title').textContent=a.name;
  document.getElementById('crumb').textContent=a.key==='home'?'Sentire Technologies':'Sentire › '+a.name;
  document.getElementById('reloadBtn').classList.toggle('show',a.key!=='home');
  document.getElementById('newTabBtn').classList.toggle('show',a.key!=='home');
  document.title=(a.key==='home'?'Main Page — ':a.name+' — ')+'Sentire Technologies';
  if(a.key==='home')refreshStats();
}
function reloadCurrent(){const f=document.querySelector('#v-'+current+' iframe');if(f)f.contentWindow.location.reload();}
function openNewTab(){const a=byKey(current);if(a&&a.file)window.open(a.file,'_blank');}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)||'home'));

// Apps (voice commands) ask this window to switch apps
window.addEventListener('message',e=>{
  const fromOurApp=[...document.querySelectorAll('iframe')].some(f=>f.contentWindow===e.source);
  if(!fromOurApp||!e.data||!e.data.sentireNav)return;
  const a=byFile(e.data.sentireNav);if(a)go(a.key);
});

// ═══ Today at a glance — read straight from each app's saved data ═══
function load(k){try{return JSON.parse(localStorage.getItem(k))||[];}catch(e){return [];}}
function refreshStats(){
  const orders=load('ordersheet_master_db');
  const canApv=!window.SentireAuth||!SentireAuth.canApprove||SentireAuth.canApprove();
  const awaiting=canApv?orders.filter(o=>o.status==='awaiting').length:0;   // only approvers see what waits for approval
  const overdue=window.ST?orders.filter(o=>{const x=ST.payInfo(o);return x.due&&x.over>0&&x.action!=='paid';}).length:orders.filter(o=>o.status!=='cancelled'&&o.paymentMode==='Credit'&&o.dod&&o.creditDays&&((Date.now()-new Date(o.dod))/86400000)>parseInt(o.creditDays)&&!o.paymentDone).length;
  const leads=load('crm_leads').filter(l=>l.status!=='Converted'&&l.status!=='Lost').length;
  const jobs=load('prod_jobs').filter(j=>j.stage!=='Dispatched').length;
  const low=load('inv_items').filter(i=>(i.reorder||0)>0&&(i.stock||0)<=i.reorder).length;
  // Job work: goods lying with outside parties
  // Our own factories are not "outside" — only job workers count here
  const ownPlace=n=>!n||n==='Our Premises'||n==='Baroda Factory'||n==='Ahmedabad Factory';
  const jw={};load('jw_moves').forEach(m=>{const q=parseFloat(m.qty)||0;const it=(m.item||'').trim();if(!q||!it)return;
    if(!ownPlace(m.to)&&m.type!=='scrap'){jw[m.to+'|'+it]=(jw[m.to+'|'+it]||0)+q;}
    if(!ownPlace(m.from)){jw[m.from+'|'+it]=(jw[m.from+'|'+it]||0)-q;}});
  const jwLines=Object.entries(jw).filter(([k,v])=>v>1e-9);
  const jwParties=new Set(jwLines.map(([k])=>k.split('|')[0])).size;
  const today=new Date().toISOString().slice(0,10);
  const jwOverdue=new Set(load('jw_moves').filter(m=>!ownPlace(m.to)&&m.expected&&m.expected<today&&jw[m.to+'|'+(m.item||'').trim()]>1e-9).map(m=>m.to+'|'+(m.item||'').trim())).size;
  const ym=new Date().toISOString().slice(0,7);
  const fin=load('fin_entries').filter(e=>(e.date||'').startsWith(ym));
  const inc=fin.filter(e=>e.type==='income').reduce((s,e)=>s+(+e.amount||0),0);
  const exp=fin.filter(e=>e.type==='expense').reduce((s,e)=>s+(+e.amount||0),0);
  const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
  // Production approvals + pickup messages + payments to chase
  const pj=load('prod_jobs');
  const apv=pj.filter(j=>j.stage==='Testing').length;
  const pickups=pj.filter(j=>j.stage==='Ready'&&!j.pickupMsgAt).length;
  const cut=(window.ST?ST.company().cutoff:'14:00')||'14:00';
  let rs={};try{rs=JSON.parse(localStorage.getItem('rem_summary'))||{};}catch(e){}
  const chase=window.ST?orders.map(o=>ST.payInfo(o)).filter(x=>x.action==='remind'||x.action==='escalate').length:0;
  const cards=[
    {k:'orders',label:'Orders to approve',val:awaiting,sub:'waiting before production',c:'#a855f7',alert:awaiting>0},
    {k:'orders',label:'Overdue payments',val:overdue,sub:chase?chase+' reminder/escalation due today':'credit days crossed',c:'#ef4444',alert:overdue>0||chase>0},
    {k:'production',label:'Production approvals',val:apv,sub:'laser · packing · bill',c:'#a855f7',alert:apv>0},
    {k:'production',label:'Pickup WhatsApps',val:pickups,sub:'send before '+cut,c:'#25d366',alert:pickups>0},
    {k:'reminders',label:'Reminders this week',val:rs.week||0,sub:(rs.today?rs.today+' today':'none today')+(rs.overdue?' · '+rs.overdue+' overdue':'')+(rs.review?' · '+rs.review+' to review':''),c:'#f43f5e',alert:(rs.today||0)+(rs.overdue||0)>0},
    {k:'crm',label:'Active leads',val:leads,sub:'not converted or lost',c:'#a855f7'},
    {k:'production',label:'Jobs in production',val:jobs,sub:'not yet dispatched',c:'#22c55e'},
    {k:'jobwork',label:'Goods at job workers',val:jwParties,sub:jwLines.length+' item lines outside'+(jwOverdue?' · '+jwOverdue+' overdue':''),c:'#ec4899',alert:jwOverdue>0},
    {k:'inventory',label:'Low-stock items',val:low,sub:'at or below reorder level',c:'#f59e0b',alert:low>0},
    {k:'accounts',label:'This month',val:inr(inc-exp),sub:'in '+inr(inc)+' · out '+inr(exp),c:'#06b6d4'}
  ];
  document.getElementById('kpis').innerHTML=cards.filter(x=>byKey(x.k)).map(x=>`<button class="kpi${x.alert?' alert':''}" style="--c:${x.c}" onclick="go('${x.k}')"><div class="k-label">${x.label}</div><div class="k-val">${x.val}</div><div class="k-sub">${x.sub}</div></button>`).join('');
  const setBadge=(k,n)=>{const b=document.getElementById('b-'+k);if(b){b.textContent=n;b.classList.toggle('show',n>0);}};
  setBadge('orders',awaiting+chase);setBadge('production',apv+pickups);setBadge('reminders',(rs.today||0)+(rs.overdue||0));setBadge('inventory',low);setBadge('jobwork',jwOverdue);
}
window.addEventListener('storage',()=>{if(current==='home')refreshStats();});

// Greeting
const h=new Date().getHours();
document.getElementById('greet').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', '+((window.SentireAuth&&SentireAuth.user&&SentireAuth.user.name)||'Abhishek');
document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

// ═══ Voice commands (Chrome) ═══
let rec=null,listening=false;
function status(t){document.getElementById('micStatus').textContent=t;}
function initVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){status('Voice needs Chrome');return false;}
  rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='en-IN';
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.toLowerCase().trim();handleVoice(t);};
  rec.onend=()=>{if(listening)try{rec.start();}catch(e){}};
  return true;
}
function toggleVoice(){
  if(!rec&&!initVoice())return;
  listening=!listening;
  if(listening){try{rec.start();}catch(e){}status('Listening… say "open orders"');}
  else{try{rec.stop();}catch(e){}status('');}
  document.getElementById('micBtn').classList.toggle('on',listening);
  document.getElementById('micLabel').textContent=listening?'Listening…':'Voice commands';
}
function handleVoice(t){
  const map=[[['order'],'orders'],[['marketing','crm','lead','telecaller'],'crm'],[['production','factory','job'],'production'],[['job work','jobwork','job worker','challan'],'jobwork'],[['calculator','sensitivity','trim','resistor'],'calculator'],[['inventory','stock'],'inventory'],[['account','finance','expense','income','report'],'accounts'],[['reminder','remind'],'reminders'],[['cohort','data pool','ask data'],'cohort'],[['master','holiday','approver'],'masters'],[['main page','home','dashboard','main menu','go back'],'home']];
  if(t.includes('stop listening')||t.includes('stop voice')){toggleVoice();return;}
  for(const [words,key] of map){if(words.some(w=>t.includes(w))){status('"'+t+'" → '+byKey(key).name);go(key);return;}}
  status('Not recognised: "'+t+'"');
}

// Start on the page in the address bar (e.g. index.html#orders), or Home
show(location.hash.slice(1)||'home');
</script>
